<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="styleDashboard.css">
</head>
<body>
    <div class="container">
        <h1>Dashboard</h1>
        <div class="KPIS">   
            <div class="card_comeias">
                <h2>Total de Comeias</h2>
                <p>Quantidade</p>
                <p>Indicação</p>

            </div>
            <div class="card_temperatura">
                  <h2>Temperatura Média nas Comeias</h2>
                <p>Temperatura</p>
                <p>Indicação</p>
            </div>
            <div class="card_producao">
                  <h2>Produção de Mel</h2>
                <p>Temperatura</p>
                <p>Indicação</p>
            </div>
            <div class="card_aviso">
                  <h2>Alertas Ativos</h2>
                <p>Quantidade</p>
                <p>Indicação</p>
            </div>
        </div>
        <div class="grafico_temp"></div>
        <div class="grafico_2"></div>

        <div class="mensagens">
            <div class="leituras_temp">
                <div class="titulo">
                    <h2>Colmeia</h2>
                    <h2>Temperatura</h2>
                    <h2>Horário</h2>
                </div>
            </div>

            <div class="card_alertas">
                <img src="" alt="">
                <h2>Alertas Recentes</h2>
                <div id="mensagem">
                    <span id="situacao"></span>
                    <div id="titulo"> a</div><!--Comeia que está acontecendo-->
                    <div id="descricao"> a</div><!--descrição do que está acontecendo-->
                    <div id="dataHorario"> a</div><!--Horário do alerta-->
                </div>
            </div>
        </div>
    </div>
</body>
</html>
