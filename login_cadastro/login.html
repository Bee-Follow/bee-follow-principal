<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bee Follow - Login</title>
    <link rel="stylesheet" href="cadastroElogin.css">
</head>
<body>

    <div class="lado-esquerdo">
        <div class="conteiner-logo">
            <img class="imagem-logo" src="../img/logo_login_cadastro.png" alt="Bee Follow Logo">
        </div>
    </div>

    <div class="lado-direito">
        <h1>Bem-Vindo novamente!</h1>
        <h2>Faça login para continuar</h2>

        <div class="grupo-formulario">
            <label for="ipt_email">Email</label>
            <input type="email" id="ipt_email" placeholder="seuemail@exemplo.com">
        </div>

        <div class="grupo-formulario">
            <label for="ipt_senha">Senha</label>
            <input type="password" id="ipt_senha" placeholder="********">
        </div>

        <button onclick="entrar()">Entrar</button><br><br>
        <div id="div_aviso"></div>
        <div class="secao-cadastro">
            <label>Caso não tenha Login</label>
            <button onclick="irParaCadastro()">Fazer cadastro</button>
        </div>
    </div>

   <script>
    let senha_estatica = 'abelhas@123'
    let email_estatico = 'beefollow@gmail.com'
        function entrar() {
            let email = ipt_email.value;
            let senha = ipt_senha.value;
            let JsonEmail = window.localStorage.getItem('email');
            let JsonSenha = window.localStorage.getItem('senha');
            let verifca_email = JSON.parse(JsonEmail)
            let verifca_senha = JSON.parse(JsonSenha)
            
            if (email == verifca_email && senha == verifca_senha) {
                alert ('Login efetuado com sucesso!')
                window.location.href = '../dashboard/dashboard.html'
            } else {
                div_aviso.innerHTML='Por favor, preencha todos os campos!';
            }
        }

        function irParaCadastro() {
            window.location.href = 'cadastro.html'; 
        }
    </script>
</body>
</html>
