<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bee Follow - Login</title>
    <link rel="stylesheet" href="cadastroElogin.css">
    <script src="../cadastro.js"></script>
</head>
<body>

    <div class="lado-esquerdo">
        <div class="conteiner-logo">
            <img class="imagem-logo" src="../img/logo_login_cadastro.png" alt="Bee Follow Logo">
        </div>
    </div>

    <div class="lado-direito">
        <div id="toast" class="hidden show"></div>
        <br>
        <h1>Bem-Vindo novamente!</h1>
        <h2>Faça login para continuar</h2>

        <div class="grupo-formulario">
            <label for="ipt_email">Email</label>
            <input type="email" id="ipt_email" placeholder="seuemail@exemplo.com">
        </div>

        <div class="grupo-formulario">
            <label for="ipt_senha">Senha</label>
            <input type="password" id="ipt_senha" placeholder="********">
        </div>

        <button onclick="entrar()" id="btnEntrar">Entrar</button><br><br>
        <div id="div_aviso"></div>
        <div class="secao-cadastro">
            <label>Caso não tenha Login</label>
            <button onclick="irParaCadastro()">Fazer cadastro</button>
        </div>
    </div>

   <script>
    const showToastBtn = document.getElementById('btnEntrar');
            const toast = document.getElementById('toast');
            showToastBtn.addEventListener('click', function() {
            toast.classList.remove('hidden');
            toast.classList.add('show');
            setTimeout(function() {
                    toast.classList.add('hidden');
                }, 5000);
            });
        function entrar() {
            const cadastro = JSON.parse(localStorage.getItem("dadosCadastro"))
            let email = ipt_email.value;
            let senha = ipt_senha.value;
                if (email == '' || senha == '') {
                 toast.innerHTML='Por favor, preencha todos os campos!';
                } else if (email == cadastro.email && senha == cadastro.senha ) {
                    toast.innerHTML = "Bem-vindo! Aguarde o redirecionamento para a próxima tela."
                    setTimeout(() => {
                        window.location = "../dashboard/dashboard.html";
                    }, "3000");
                } else {
                    toast.innerHTML = "E-mail ou senha incorreta."
                }
            }
        function irParaCadastro() {
            window.location.href = 'cadastro.html'; 
        }
    </script>
</body>
</html>
